<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/mediaquery.css">
</head>
<body>
    <main>
        <div id="imagem"></div>
        <div id="login">            
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessa sua conta e poder fazer as configurações no seu ambiente</p>
                <form action="">
                    <div class="campo">
                        <img src="imagens/icons8-usuário-50.png" alt="" id="img-person">
                        <input type="email" id="iemail" placeholder="Digite seu Email" required autocomplete="email" maxlength="30">
                        <label for="iemail">Login</label>
                    </div>

                    <div class="campo">
                        <img src="imagens/icons8-chave-24.png" alt="" id="img-key">
                        <input type="password" id="isenha" placeholder="Digite sua Senha" required autocomplete="current-password" minlength="8">
                        <label for="isenha">Senha</label>
                    </div>
                    
                    <input type="submit" value="Entrar">
                    <a href="esqueci a senha">
                        Esqueci a Senha <img src="imagens/icons8-mensagem-preenchida-48.png" alt="">
                    </a>
                    
                    
                </form>
            </div>
        </div>
    </main>

</body>
</html>
